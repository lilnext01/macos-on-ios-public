name: Build macOS-on-iOS Probe IPA

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-probe:
    runs-on: macos-26
    timeout-minutes: 30
    env:
      TEAM: ${{ secrets.APPLE_TEAM_ID }}
      IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
      BUNDLE_PREFIX: com.example
      T: ${{ runner.temp }}/macos-on-ios
      UDID: build-only-no-device
    steps:
      - uses: actions/checkout@v4
      - name: Check Xcode
        run: |
          xcode-select -p
          xcodebuild -version
      - name: Import signing certificate
        env:
          P12: ${{ secrets.APPLE_CERTIFICATE_P12_BASE64 }}
          P12_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_P12_PASSWORD }}
        run: |
          set -euo pipefail
          echo "$P12" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security create-keychain -p temporary "$RUNNER_TEMP/signing.keychain-db"
          security unlock-keychain -p temporary "$RUNNER_TEMP/signing.keychain-db"
          security import "$RUNNER_TEMP/cert.p12" -k "$RUNNER_TEMP/signing.keychain-db" -P "$P12_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k temporary "$RUNNER_TEMP/signing.keychain-db"
          security list-keychains -d user -s "$RUNNER_TEMP/signing.keychain-db" login.keychain-db
      - name: Install provisioning profile
        env:
          PROFILE: ${{ secrets.APPLE_PROVISIONING_PROFILE_BASE64 }}
        run: |
          set -euo pipefail
          mkdir -p "$T/profiles"
          echo "$PROFILE" | base64 --decode > "$T/profiles/com.example.macprobe.mobileprovision"
      - name: Build and convert
        run: |
          set -euo pipefail
          cd probe
          ./build.sh mac shim convert
          codesign --verify --deep --strict "$T/MacProbe-ios.app"
      - name: Package IPA
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/package/Payload"
          ditto "$T/MacProbe-ios.app" "$RUNNER_TEMP/package/Payload/MacProbe-ios.app"
          cd "$RUNNER_TEMP/package"
          ditto -c -k --sequesterRsrc --keepParent Payload "$GITHUB_WORKSPACE/MacProbe.ipa"
      - uses: actions/upload-artifact@v4
        with:
          name: MacProbe-IPA
          path: MacProbe.ipa
          if-no-files-found: error
          retention-days: 7
