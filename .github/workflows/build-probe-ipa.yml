name: Build macOS-on-iOS Probe IPA

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-probe:
    # Use a current macOS runner with Xcode and Apple Silicon SDKs.
    runs-on: macos-26
    timeout-minutes: 30

    env:
      TEAM: ${{ secrets.APPLE_TEAM_ID }}
      IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
      BUNDLE_PREFIX: com.example
      T: ${{ runner.temp }}/macos-on-ios
      UDID: build-only-no-device

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Select Xcode
        shell: bash
        run: |
          set -euo pipefail
          xcode-select -p
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version
          xcrun --sdk macosx --show-sdk-version

      - name: Import Apple Development signing certificate
        env:
          CERTIFICATE_P12_BASE64: ${{ secrets.APPLE_CERTIFICATE_P12_BASE64 }}
          CERTIFICATE_P12_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_P12_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$CERTIFICATE_P12_BASE64" || { echo "Missing APPLE_CERTIFICATE_P12_BASE64"; exit 1; }
          test -n "$CERTIFICATE_P12_PASSWORD" || { echo "Missing APPLE_CERTIFICATE_P12_PASSWORD"; exit 1; }

          KEYCHAIN="$RUNNER_TEMP/build-signing.keychain-db"
          KEYCHAIN_PASSWORD="$(openssl rand -hex 24)"
          echo "$CERTIFICATE_P12_BASE64" | base64 --decode > "$RUNNER_TEMP/apple-cert.p12"

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security import "$RUNNER_TEMP/apple-cert.p12" \
            -k "$KEYCHAIN" -P "$CERTIFICATE_P12_PASSWORD" \
            -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple: -s \
            -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security list-keychains -d user -s "$KEYCHAIN" login.keychain-db
          security find-identity -v -p codesigning "$KEYCHAIN"

      - name: Install provisioning profile
        env:
          PROFILE_BASE64: ${{ secrets.APPLE_PROVISIONING_PROFILE_BASE64 }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$PROFILE_BASE64" || { echo "Missing APPLE_PROVISIONING_PROFILE_BASE64"; exit 1; }

          mkdir -p "$T/profiles"
          echo "$PROFILE_BASE64" | base64 --decode > "$T/profiles/com.example.macprobe.mobileprovision"
          security cms -D -i "$T/profiles/com.example.macprobe.mobileprovision" \
            > "$RUNNER_TEMP/profile.plist"
          PROFILE_BID=$(/usr/libexec/PlistBuddy -c 'Print :Entitlements:application-identifier' "$RUNNER_TEMP/profile.plist")
          echo "Provisioning profile application identifier: $PROFILE_BID"
          case "$PROFILE_BID" in
            *".com.example.macprobe"|"TEAMID.com.example.macprobe") ;;
            *) echo "Profile may not match com.example.macprobe; check the App ID and Team ID."; exit 1 ;;
          esac

      - name: Build and convert probe
        shell: bash
        run: |
          set -euo pipefail
          test -n "$TEAM" || { echo "Missing APPLE_TEAM_ID"; exit 1; }
          test -n "$IDENTITY" || { echo "Missing APPLE_SIGNING_IDENTITY"; exit 1; }

          # The upstream script requires UDID at startup, but this workflow
          # deliberately omits install/launch, so no connected device is needed.
          cd probe
          ./build.sh mac shim convert

          test -d "$T/MacProbe-ios.app"
          test -f "$T/MacProbe-ios.app/MacProbe"
          test -f "$T/MacProbe-ios.app/embedded.mobileprovision"
          codesign --verify --deep --strict "$T/MacProbe-ios.app"

      - name: Package IPA
        shell: bash
        run: |
          set -euo pipefail
          PACKAGE="$RUNNER_TEMP/ipa-package"
          rm -rf "$PACKAGE"
          mkdir -p "$PACKAGE/Payload"
          ditto "$T/MacProbe-ios.app" "$PACKAGE/Payload/MacProbe-ios.app"
          (
            cd "$PACKAGE"
            ditto -c -k --sequesterRsrc --keepParent Payload "$GITHUB_WORKSPACE/MacProbe.ipa"
          )
          test -s "$GITHUB_WORKSPACE/MacProbe.ipa"
          unzip -l "$GITHUB_WORKSPACE/MacProbe.ipa"

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: MacProbe-IPA
          path: MacProbe.ipa
          if-no-files-found: error
          retention-days: 7
